---
# defaults file for common
foreman_version: 3.7
puppet_version: puppet7

# install options
foreman_cmd_options: ['--puppet-server-admin-api-whitelist=localhost --puppet-server-admin-api-whitelist={{ inventory_hostname }} --puppet-server-ca-client-whitelist=localhost --puppet-server-ca-client-whitelist={{ inventory_hostname }}']
foreman_plugins: []
foreman_compute: []
foreman_proxy_plugins: []

puppet_repo_key: https://apt.puppetlabs.com/keyring.gpg
puppet_repo_url: deb https://apt.puppetlabs.com/ {{ ansible_distribution_release }} {{ puppet_version }}
foreman_repo_key: https://deb.theforeman.org/foreman.asc
foreman_repo_url: deb https://deb.theforeman.org/ {{ ansible_distribution_release }} {{ foreman_version }}
plugins_repo_key: https://deb.theforeman.org/foreman.asc
plugins_repo_url: deb https://deb.theforeman.org/ plugins {{ foreman_version }}

# configure options
foreman_options: []
foreman_plugin_options: []
foreman_compute_options: []

# --puppet-
puppet_options:
  server: 'true'

# --puppet-server-
puppet_server_options:
  foreman-url: "https://{{ groups['tfm_app'][0] }}"
  ca: 'true'
  admin-api-whitelist: "{{ groups['tfm_proxy'][0] }}"
  ca-client-whitelist: "{{ groups['tfm_proxy'][0] }}"
  envs-dir: '/etc/puppetlabs/code/environments'

foreman_proxy_plugin_options: []
foreman_proxy_options: []
